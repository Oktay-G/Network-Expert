
! LAB 1 - Basic LAN Network Infrastructure
! Tafel 07 - Cisco ISR4221
! Relevante labconfiguratie (geen volledige running-config)

hostname Router

interface GigabitEthernet0/0/0
 description LAN-uplink-naar-SW1
 no ip address
 no shutdown

interface GigabitEthernet0/0/0.17
 description VLAN17-Management
 encapsulation dot1Q 17
 ip address 172.16.7.2 255.255.255.192

interface GigabitEthernet0/0/0.27
 description VLAN27-VM-Hosts
 encapsulation dot1Q 27
 ip address 172.16.7.66 255.255.255.192

interface GigabitEthernet0/0/0.37
 description VLAN37-Appliance-Servers
 encapsulation dot1Q 37
 ip address 172.16.7.130 255.255.255.192

interface GigabitEthernet0/0/0.47
 description VLAN47-Data-Users
 encapsulation dot1Q 47
 ip address 172.16.7.194 255.255.255.192
 ip helper-address 10.199.64.66

interface GigabitEthernet0/0/1
 description Uplink-naar-Centraal-Netwerk
 ip address 10.199.66.207 255.255.255.224
 no shutdown

router ospf 7
 router-id 7.7.7.7
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface GigabitEthernet0/0/1
 network 10.199.66.192 0.0.0.31 area 0
 network 172.16.7.0 0.0.0.255 area 0
