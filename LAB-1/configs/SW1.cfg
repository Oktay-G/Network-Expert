! LAB 1 - Basic LAN Network Infrastructure
! Tafel 07 - Cisco Catalyst C9200L
! Relevante labconfiguratie

hostname Switch

vlan 17
 name Management
!
vlan 27
 name VM-Hosts
!
vlan 37
 name Appliance-Servers
!
vlan 47
 name Data-Users
!
vlan 99
 name Native-Vlan
!

interface GigabitEthernet1/0/11
 description Laptop-Tafel07
 switchport mode access
 switchport access vlan 47
 spanning-tree portfast
 no shutdown
!

interface GigabitEthernet1/0/24
 description TRUNK-naar-Router-R01
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 17,27,37,47,99
 no shutdown
!

interface Vlan17
 description Management-SW01
 ip address 172.16.7.4 255.255.255.192
 no shutdown
!

ip default-gateway 172.16.7.2
